; PlatformIO Configuration für Multi-Target Setup
; Alle drei Boards: ESP32, Arduino Uno, Arduino Nano

[platformio]
default_envs = esp32

[common]
lib_deps = 
    Wire
    Servo

; ─────────────────────────────────────────────────────────────
; ESP32 (Master) - Serial Control 115200 Baud
; ─────────────────────────────────────────────────────────────
[env:esp32]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_port = /dev/cu.SLAB_USBtoUART
lib_deps = ${common.lib_deps}

src_dir = src_esp32
include_dir = include

; ─────────────────────────────────────────────────────────────
; Arduino Uno (Slave 0x33) - Stepper Control
; ─────────────────────────────────────────────────────────────
[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 9600
monitor_port = /dev/cu.usbserial-*
lib_deps = ${common.lib_deps}

src_dir = src_ELEGOOuno
include_dir = include

; ─────────────────────────────────────────────────────────────
; Arduino Nano (Slave 0x32) - Servo Control
; ─────────────────────────────────────────────────────────────
[env:nano]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 9600
monitor_port = /dev/cu.usbserial-*
lib_deps = ${common.lib_deps}

src_dir = src_Nano
include_dir = include
