; PlatformIO Configuration für Multi-Target Setup
; Alle drei Boards: ESP32, Arduino Uno, Arduino Nano

[platformio]
src_dir = .

[common]
lib_deps = 
    Wire
    Servo
    AccelStepper

; ─────────────────────────────────────────────────────────────
; ESP32 (Master) - Serial Control 115200 Baud
; ─────────────────────────────────────────────────────────────
[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
upload_speed = 115200
monitor_speed = 115200
lib_deps = ${common.lib_deps}

build_src_filter = -<*> +<src_esp32/>
build_flags = -Iinclude

; ─────────────────────────────────────────────────────────────
; Arduino Uno (Slave 0x33) - Stepper Control
; ─────────────────────────────────────────────────────────────
[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 9600
lib_deps = ${common.lib_deps}

build_src_filter = -<*> +<src_ELEGOOuno/>
build_flags = -Iinclude

; ─────────────────────────────────────────────────────────────
; Arduino Nano (Slave 0x32) - Servo Control
; ─────────────────────────────────────────────────────────────
[env:nano]
platform = atmelavr
board = nanoatmega328new
framework = arduino
monitor_speed = 9600
lib_deps = ${common.lib_deps}

build_src_filter = -<*> +<src_Nano/>
build_flags = -Iinclude
